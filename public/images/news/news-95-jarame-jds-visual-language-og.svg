<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">자람이 JDS 발달지원 시각언어 규격</title>
  <desc id="desc">같은 의미를 가정, 센터, 학교, 병원에서 일관된 시각언어로 사용하는 JDS 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="82" r="180" fill="#ffffff" opacity=".06"/>
  <circle cx="105" cy="592" r="220" fill="#2dd4bf" opacity=".11"/>

  <text x="72" y="82" fill="#ccfbf1" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="700">JARAM DESIGN SYSTEM · JDS v1</text>
  <text x="72" y="150" fill="#ffffff" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="52" font-weight="800">같은 의미를, 어디서나</text>
  <text x="72" y="211" fill="#ffffff" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="52" font-weight="800">같은 시각언어로</text>
  <text x="72" y="260" fill="#e0e7ff" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="24">Core 48 → Essential 150 → Extended 500+ → Personal Vocabulary</text>

  <g filter="url(#shadow)">
    <rect x="470" y="315" width="260" height="188" rx="28" fill="#ffffff"/>
    <rect x="494" y="339" width="212" height="54" rx="14" fill="#ccfbf1"/>
    <text x="600" y="375" text-anchor="middle" fill="#0f766e" font-family="Arial, sans-serif" font-size="22" font-weight="700">meaning.need.water</text>
    <path d="M600 414c-31 42-47 66-47 91a47 47 0 0 0 94 0c0-25-16-49-47-91Z" fill="#38bdf8"/>
    <text x="600" y="484" text-anchor="middle" fill="#0f172a" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="25" font-weight="800">물 주세요</text>
  </g>

  <g fill="none" stroke="#99f6e4" stroke-width="5" stroke-linecap="round" opacity=".9">
    <path d="M330 372H445"/><path d="M755 372H870"/>
    <path d="M330 482H445"/><path d="M755 482H870"/>
  </g>

  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="75" y="320" width="250" height="100" rx="22" fill="#ffffff"/>
      <text x="200" y="360" fill="#0f172a" font-size="26" font-weight="800">가정</text>
      <text x="200" y="393" fill="#475569" font-size="19">보호자 · 생활</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="875" y="320" width="250" height="100" rx="22" fill="#ffffff"/>
      <text x="1000" y="360" fill="#0f172a" font-size="26" font-weight="800">센터</text>
      <text x="1000" y="393" fill="#475569" font-size="19">치료사 · 교육</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="75" y="430" width="250" height="100" rx="22" fill="#ffffff"/>
      <text x="200" y="470" fill="#0f172a" font-size="26" font-weight="800">학교</text>
      <text x="200" y="503" fill="#475569" font-size="19">교사 · 수업</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="875" y="430" width="250" height="100" rx="22" fill="#ffffff"/>
      <text x="1000" y="470" fill="#0f172a" font-size="26" font-weight="800">병원</text>
      <text x="1000" y="503" fill="#475569" font-size="19">상태 · 안전</text>
    </g>
  </g>

  <rect x="72" y="570" width="1056" height="1" fill="#ffffff" opacity=".28"/>
  <text x="72" y="608" fill="#ffffff" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="22" font-weight="700">자람이 × 드림에이아이랩</text>
  <text x="1128" y="608" text-anchor="end" fill="#ccfbf1" font-family="Arial, sans-serif" font-size="18">jarame.or.kr/design-system</text>
</svg>
