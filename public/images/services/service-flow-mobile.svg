<svg width="900" height="1560" viewBox="0 0 900 1560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">서비스 간 연결 흐름 (모바일)</title>
  <desc id="desc">6개 도메인 서비스 연결과 공통 AI디지털케어로그 레이어를 세로로 정리한 모바일 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="1560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="ai" x1="70" y1="1180" x2="830" y2="1420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style type="text/css"><![CDATA[
      .t { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    ]]></style>
  </defs>

  <rect width="900" height="1560" rx="28" fill="url(#bg)"/>

  <text class="t" x="450" y="68" text-anchor="middle" font-size="36" font-weight="800" fill="#0F172A">서비스 간 연결 흐름</text>
  <text class="t" x="450" y="112" text-anchor="middle" font-size="20" font-weight="600" fill="#475569">도메인은 달라도 맥락은 이어집니다</text>

  <g class="t" filter="url(#card)">
    <rect x="90" y="160" width="720" height="110" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="160" cy="215" r="28" fill="#FEF3C7"/><text x="160" y="223" text-anchor="middle" font-size="16" font-weight="800" fill="#B45309">GC</text>
    <text x="220" y="205" font-size="26" font-weight="800" fill="#0F172A">글로벌커플케어</text>
    <text x="220" y="240" font-size="18" font-weight="600" fill="#64748B">정착·행정·가족 라이프로그</text>

    <text x="450" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#4338CA">↓ 정착 → 의료 (예시)</text>

    <rect x="90" y="340" width="720" height="110" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="160" cy="395" r="28" fill="#CFFAFE"/><text x="160" y="403" text-anchor="middle" font-size="16" font-weight="800" fill="#0E7490">TC</text>
    <text x="220" y="385" font-size="26" font-weight="800" fill="#0F172A">토탈케어로그</text>
    <text x="220" y="420" font-size="18" font-weight="600" fill="#64748B">건강·복약·생활 케어로그</text>

    <text x="450" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#4338CA">↓ 의료 → 교육 (예시)</text>

    <rect x="90" y="520" width="720" height="110" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="160" cy="575" r="28" fill="#EDE9FE"/><text x="160" y="583" text-anchor="middle" font-size="16" font-weight="800" fill="#6D28D9">ED</text>
    <text x="220" y="565" font-size="26" font-weight="800" fill="#0F172A">에듀케어로그</text>
    <text x="220" y="600" font-size="18" font-weight="600" fill="#64748B">학습 상태·다음 행동·환류</text>

    <text x="450" y="670" text-anchor="middle" font-size="18" font-weight="700" fill="#4338CA">↓ 교육 → 생활 (예시)</text>

    <rect x="90" y="700" width="720" height="110" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="160" cy="755" r="28" fill="#DCFCE7"/><text x="160" y="763" text-anchor="middle" font-size="16" font-weight="800" fill="#166534">VG</text>
    <text x="220" y="745" font-size="26" font-weight="800" fill="#0F172A">베지케어</text>
    <text x="220" y="780" font-size="18" font-weight="600" fill="#64748B">식습관·영양 판단·실행</text>

    <text x="450" y="850" text-anchor="middle" font-size="18" font-weight="700" fill="#4338CA">↓ 생활 → 돌봄 (예시)</text>

    <rect x="90" y="880" width="720" height="110" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="160" cy="935" r="28" fill="#DCFCE7"/><text x="160" y="943" text-anchor="middle" font-size="16" font-weight="800" fill="#15803D">SL</text>
    <text x="220" y="925" font-size="26" font-weight="800" fill="#0F172A">시니어앤라이프</text>
    <text x="220" y="960" font-size="18" font-weight="600" fill="#64748B">돌봄·생활 연속 관리</text>

    <text x="450" y="1030" text-anchor="middle" font-size="18" font-weight="700" fill="#4338CA">↓ 돌봄 → 발달 / 가족 (예시)</text>

    <rect x="90" y="1060" width="720" height="110" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="160" cy="1115" r="28" fill="#DBEAFE"/><text x="160" y="1123" text-anchor="middle" font-size="16" font-weight="800" fill="#1D4ED8">JR</text>
    <text x="220" y="1105" font-size="26" font-weight="800" fill="#0F172A">자람이</text>
    <text x="220" y="1140" font-size="18" font-weight="600" fill="#64748B">발달·치료·학습 기록</text>
  </g>

  <text class="t" x="450" y="1220" text-anchor="middle" font-size="18" font-weight="600" fill="#64748B">※ 고정 순서가 아닌 도메인 연결 예시입니다</text>

  <g filter="url(#card)">
    <rect x="70" y="1250" width="760" height="200" rx="24" fill="url(#ai)"/>
    <text class="t" x="450" y="1300" text-anchor="middle" font-size="16" font-weight="700" fill="#BFDBFE" letter-spacing="0.05em">SHARED LAYER · AI디지털케어로그</text>
    <text class="t" x="450" y="1348" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">기록 연결 → 맥락 이해 → AI 판단</text>
    <text class="t" x="450" y="1388" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">설명 가능 실행 → 결과 학습·환류</text>
    <text class="t" x="450" y="1418" text-anchor="middle" font-size="16" font-weight="600" fill="#C7D2FE">모든 도메인이 공유하는 공통 구조</text>
  </g>

  <rect x="70" y="1490" width="760" height="50" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text class="t" x="450" y="1522" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">같은 사람의 맥락이 도메인을 넘어 이어집니다</text>
</svg>
