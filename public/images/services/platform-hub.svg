<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DAL 플랫폼 허브</title>
  <desc id="desc">하나의 AI디지털케어로그 위에 발달장애·시니어·의료·교육·글로벌패밀리·라이프스타일 6개 도메인이 연결되는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="core" x1="420" y1="250" x2="780" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="ring" x1="300" y1="180" x2="900" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E3A8A" flood-opacity="0.16"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style type="text/css"><![CDATA[
      .t { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    ]]></style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>

  <!-- faint orbit -->
  <circle cx="600" cy="390" r="220" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="6 10"/>
  <circle cx="600" cy="390" r="150" fill="none" stroke="#C7D2FE" stroke-width="1.5" opacity="0.7"/>

  <!-- connector lines -->
  <g stroke="#94A3B8" stroke-width="1.75" opacity="0.55">
    <path d="M600 290V210"/>
    <path d="M600 490V570"/>
    <path d="M500 340L360 250"/>
    <path d="M700 340L840 250"/>
    <path d="M500 440L360 530"/>
    <path d="M700 440L840 530"/>
  </g>

  <!-- title -->
  <text class="t" x="600" y="56" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">하나의 AI디지털케어로그 · 여섯 도메인</text>
  <text class="t" x="600" y="88" text-anchor="middle" font-size="16" font-weight="600" fill="#475569">삶의 기록을 시간축으로 연결하고, AI가 판단·실행한 뒤 결과를 다시 학습합니다</text>

  <!-- center core -->
  <g filter="url(#soft)">
    <rect x="430" y="300" width="340" height="180" rx="28" fill="url(#core)"/>
    <text class="t" x="600" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#BFDBFE" letter-spacing="0.08em">CORE ARCHITECTURE</text>
    <text class="t" x="600" y="390" text-anchor="middle" font-size="26" font-weight="800" fill="#FFFFFF">AI디지털케어로그</text>
    <text class="t" x="600" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#E0E7FF">기록 연결 → 맥락 이해 → AI 판단</text>
    <text class="t" x="600" y="448" text-anchor="middle" font-size="14" font-weight="600" fill="#E0E7FF">설명 가능 실행 → 결과 기록 → 학습 환류</text>
  </g>

  <!-- domain cards -->
  <g filter="url(#card)" class="t">
    <!-- top: 발달장애 -->
    <rect x="470" y="130" width="260" height="78" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="508" cy="169" r="16" fill="#DBEAFE"/>
    <text x="508" y="174" text-anchor="middle" font-size="12" font-weight="800" fill="#1D4ED8">JR</text>
    <text x="540" y="162" font-size="18" font-weight="800" fill="#0F172A">발달장애</text>
    <text x="540" y="186" font-size="13" font-weight="600" fill="#64748B">자람이 · 치료·학습 기록</text>

    <!-- top-left: 시니어 -->
    <rect x="120" y="200" width="250" height="78" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="158" cy="239" r="16" fill="#DCFCE7"/>
    <text x="158" y="244" text-anchor="middle" font-size="12" font-weight="800" fill="#15803D">SL</text>
    <text x="190" y="232" font-size="18" font-weight="800" fill="#0F172A">시니어·돌봄</text>
    <text x="190" y="256" font-size="13" font-weight="600" fill="#64748B">시니어앤라이프</text>

    <!-- top-right: 의료 -->
    <rect x="830" y="200" width="250" height="78" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="868" cy="239" r="16" fill="#CFFAFE"/>
    <text x="868" y="244" text-anchor="middle" font-size="12" font-weight="800" fill="#0E7490">TC</text>
    <text x="900" y="232" font-size="18" font-weight="800" fill="#0F172A">의료·헬스케어</text>
    <text x="900" y="256" font-size="13" font-weight="600" fill="#64748B">토탈케어로그</text>

    <!-- bottom-left: 교육 -->
    <rect x="120" y="482" width="250" height="78" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="158" cy="521" r="16" fill="#EDE9FE"/>
    <text x="158" y="526" text-anchor="middle" font-size="12" font-weight="800" fill="#6D28D9">ED</text>
    <text x="190" y="514" font-size="18" font-weight="800" fill="#0F172A">교육</text>
    <text x="190" y="538" font-size="13" font-weight="600" fill="#64748B">에듀케어로그</text>

    <!-- bottom-right: 글로벌 -->
    <rect x="830" y="482" width="250" height="78" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="868" cy="521" r="16" fill="#FEF3C7"/>
    <text x="868" y="526" text-anchor="middle" font-size="12" font-weight="800" fill="#B45309">GC</text>
    <text x="900" y="514" font-size="18" font-weight="800" fill="#0F172A">글로벌패밀리</text>
    <text x="900" y="538" font-size="13" font-weight="600" fill="#64748B">글로벌커플케어</text>

    <!-- bottom: 라이프 -->
    <rect x="470" y="552" width="260" height="78" rx="18" fill="#FFFFFF" stroke="#BFDBFE"/>
    <circle cx="508" cy="591" r="16" fill="#DCFCE7"/>
    <text x="508" y="596" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">VG</text>
    <text x="540" y="584" font-size="18" font-weight="800" fill="#0F172A">라이프스타일</text>
    <text x="540" y="608" font-size="13" font-weight="600" fill="#64748B">베지케어 · 식습관·영양</text>
  </g>

  <!-- footer note -->
  <rect x="180" y="670" width="840" height="54" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text class="t" x="600" y="704" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">도메인마다 서비스는 달라도, 기록·판단·실행·환류의 구조는 같습니다 · NoahAI(금융)는 별도 법인</text>
</svg>
