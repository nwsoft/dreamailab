<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">플랫폼 확장 4대 축</title>
  <desc id="desc">기술 확장성, 공공 정합성, RWD·RWE 환류, ESG 가치의 4개 확장 축</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="card" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <style type="text/css"><![CDATA[
      .t { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    ]]></style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text class="t" x="600" y="52" text-anchor="middle" font-size="28" font-weight="800" fill="#0F172A">플랫폼 확장 4대 축</text>
  <text class="t" x="600" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#64748B">같은 AI디지털케어로그가 산업·공공·연구·사회가치로 확장되는 방식</text>

  <g class="t" filter="url(#card)">
    <rect x="70" y="110" width="250" height="250" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
    <rect x="340" y="110" width="250" height="250" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
    <rect x="610" y="110" width="250" height="250" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
    <rect x="880" y="110" width="250" height="250" rx="22" fill="#FFFFFF" stroke="#BFDBFE"/>
  </g>

  <g>
    <rect x="163" y="140" width="64" height="64" rx="18" fill="url(#icon)"/>
    <rect x="433" y="140" width="64" height="64" rx="18" fill="url(#icon)"/>
    <rect x="703" y="140" width="64" height="64" rx="18" fill="url(#icon)"/>
    <rect x="973" y="140" width="64" height="64" rx="18" fill="url(#icon)"/>
  </g>

  <!-- icons as simple glyphs -->
  <g fill="none" stroke="#E0E7FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M183 182h24"/><path d="M195 170v24"/><circle cx="195" cy="172" r="8"/>
    <rect x="447" y="158" width="36" height="28" rx="4"/><path d="M455 158v-6h20v6"/>
    <path d="M719 158v18l-10 16h44l-10-16v-18"/><path d="M725 176h24"/>
    <path d="M989 182c10-18 28-18 36-8c-10 16-24 20-36 8z"/><path d="M1001 182l12-12"/>
  </g>

  <g class="t" font-size="20" font-weight="800" fill="#0F172A">
    <text x="195" y="244" text-anchor="middle">기술 확장성</text>
    <text x="465" y="244" text-anchor="middle">공공 정합성</text>
    <text x="735" y="244" text-anchor="middle">RWD·RWE 환류</text>
    <text x="1005" y="244" text-anchor="middle">ESG 가치</text>
  </g>

  <g class="t" font-size="14" font-weight="600" fill="#475569">
    <text x="195" y="282" text-anchor="middle">도메인만 바꿔</text>
    <text x="195" y="304" text-anchor="middle">같은 판단·환류 구조 재사용</text>
    <text x="465" y="282" text-anchor="middle">시범사업·정책 연계와</text>
    <text x="465" y="304" text-anchor="middle">기관 데이터 표준 정합</text>
    <text x="735" y="282" text-anchor="middle">실사용 기록과 근거가</text>
    <text x="735" y="304" text-anchor="middle">다음 판단을 고도화</text>
    <text x="1005" y="282" text-anchor="middle">사회적 임팩트와</text>
    <text x="1005" y="304" text-anchor="middle">사업성이 함께 성장</text>
  </g>
</svg>
